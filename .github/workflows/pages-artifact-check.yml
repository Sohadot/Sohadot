name: Pages Artifact Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build filtered Pages artifact (no deploy)
        run: python3 scripts/build_pages_artifact.py --out _site --report pages-artifact-report.json

      - name: Pages artifact regression tests
        run: python3 -m unittest tests.test_pages_artifact -v

      - name: Engineering evaluation pilot contract tests
        run: python3 -m unittest tests.test_engineering_evaluation -v

      - name: Engineering evaluation JavaScript syntax
        run: node --check validation/aec-engineering/evaluation.js

      - name: Install Chromium acceptance test runtime
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Engineering evaluation real-browser acceptance
        run: python3 -m unittest tests.test_engineering_evaluation_browser -v
