name: Valuation Integrity

on:
  pull_request:
    paths:
      - "data/valuation_*.json"
      - "js/valuation-*.js"
      - "valuation.html"
      - "kb/**"
      - "llms.txt"
      - "*.html"
      - "scripts/*valuation*"
      - "tests/**"
      - "research/**"
      - "docs/valuation-evidence/**"
      - ".github/workflows/valuation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Evidence audit (structure gated, provenance gaps reported)
        run: python scripts/audit_valuation_evidence.py --quiet

      - name: Disclosure validation
        run: python scripts/validate_valuation_disclosures.py

      - name: Evidence registry validation (research only)
        run: python scripts/validate_evidence_registry.py

      - name: Seed investigation matrix up to date
        run: python scripts/render_seed_investigation.py --check

      - name: Accuracy backtest (reported, not gated)
        run: node scripts/valuation_backtest.mjs
